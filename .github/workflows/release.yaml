name: Release

on:
  workflow_dispatch:
    inputs:
      dart_ref:
        description: 'Dart SDK git ref to build, e.g. 3.11.0 or a commit SHA'
        required: true
        default: '3.11.0'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  generate-tag:
    name: Generate release tag
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}

    steps:
      - name: Generate release tag
        id: tag
        run: |
          set -euxo pipefail
          TAG=Build_$(date +"%Y.%m.%d_%H-%M-%S")
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

  build-upload:
    name: Build and Upload Artifacts
    needs: generate-tag
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.info.experimental }}

    env:
      OUTPUT_FILENAME: ${{ matrix.info.out_dir }}_dart-sdk.tar.gz
      DART_REF: ${{ inputs.dart_ref }}

    strategy:
      fail-fast: false
      matrix:
        info:
          - out_dir: ReleaseASANX64
            build_sanitizer_flag: asan
            options_prefix: ASAN
            options_value: 'handle_segv=0:detect_leaks=1:detect_stack_use_after_return=0:disable_coredump=0:abort_on_error=1'
            experimental: false

          - out_dir: ReleaseMSANX64
            build_sanitizer_flag: msan
            options_prefix: MSAN
            options_value: 'handle_segv=0:detect_leaks=1:detect_stack_use_after_return=0:disable_coredump=0:abort_on_error=1'
            experimental: false

          - out_dir: ReleaseLSANX64
            build_sanitizer_flag: lsan
            options_prefix: ASAN # not a typo - https://github.com/dart-lang/sdk/issues/54204
            options_value: 'handle_segv=0:detect_leaks=1:detect_stack_use_after_return=0:disable_coredump=0:abort_on_error=1'
            experimental: false

          - out_dir: ReleaseTSANX64
            build_sanitizer_flag: 'tsan dart'
            options_prefix: TSAN
            options_value: 'handle_segv=0:disable_coredump=0:abort_on_error=1:report_thread_leaks=0'
            experimental: true

          - out_dir: ReleaseUBSANX64
            build_sanitizer_flag: ubsan
            options_prefix: UBSAN
            options_value: 'handle_segv=0:disable_coredump=0:abort_on_error=1'
            experimental: true

    steps:
      # ref: https://github.com/dart-lang/sdk/wiki/Building

      - uses: catchpoint/workflow-telemetry-action@v1

      - run: echo 'release_tag=${{ needs.generate-tag.outputs.release_tag }}'

      - run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils
          
      - run: |
          set -euxo pipefail
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git

      - run: |
          set -euxo pipefail

          export PATH="$PATH:$PWD/depot_tools"

          mkdir dart-sdk
          cd dart-sdk
          fetch dart
          cd sdk
          git fetch --tags origin
          git checkout "$DART_REF"
          gclient sync
          git rev-parse HEAD | tee ../../dart-sdk-commit.txt
          ls -al

      # https://github.com/dart-lang/sdk/blob/master/docs/Debugging-Dart-VM-with-AddressSanitizer.md
      - run: |
          set -euxo pipefail
          cd dart-sdk/sdk
          export ${{ matrix.info.options_prefix }}_OPTIONS="${{ matrix.info.options_value }}"
          export ${{ matrix.info.options_prefix }}_SYMBOLIZER_PATH="$PWD/buildtools/linux-x64/clang/bin/llvm-symbolizer"
          ./tools/build.py --mode release --arch x64 --sanitizer ${{ matrix.info.build_sanitizer_flag }} runtime runtime_precompiled create_sdk
          ls -al

      - run: |
          set -euxo pipefail

          tar -czvf ${{ env.OUTPUT_FILENAME }} dart-sdk/sdk/out/${{ matrix.info.out_dir }}/dart-sdk
          shasum -a 256 ${{ env.OUTPUT_FILENAME }} | tee ${{ env.OUTPUT_FILENAME }}.sha256

      - run: |
          set -euxo pipefail

          ls -al dart-sdk
          ls -al dart-sdk/sdk
          ls -al dart-sdk/sdk/out
          ls -al dart-sdk/sdk/out/${{ matrix.info.out_dir }}
          ls -al dart-sdk/sdk/out/${{ matrix.info.out_dir }}/dart-sdk
          ls -al dart-sdk/sdk/out/${{ matrix.info.out_dir }}/dart-sdk/bin
          dart-sdk/sdk/out/${{ matrix.info.out_dir }}/dart-sdk/bin/dart --version 2>&1 | tee dart-version.txt
          {
            echo '## Dart sanitizer artifact'
            echo
            echo '- Dart ref: `${{ inputs.dart_ref }}`'
            echo "- Dart commit: `$(cat dart-sdk-commit.txt)`"
            echo '- Sanitizer output directory: `${{ matrix.info.out_dir }}`'
            echo '- Dart version: `'"$(cat dart-version.txt)"'`'
            echo '- SHA256: `'"$(cat ${{ env.OUTPUT_FILENAME }}.sha256)"'`'
          } | tee release-notes-${{ matrix.info.out_dir }}.md

      - uses: actions/upload-artifact@v4
        with:
          name: Dart_Out_${{ matrix.info.out_dir }}_dart-sdk
          path: |
            ${{ env.OUTPUT_FILENAME }}
            ${{ env.OUTPUT_FILENAME }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Dart_Out_${{ matrix.info.out_dir }}
          path: dart-sdk/sdk/out/${{ matrix.info.out_dir }}/

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.generate-tag.outputs.release_tag }}
          body: |
            Dart sanitizer SDK artifacts.

            Dart ref: `${{ inputs.dart_ref }}`

            Each asset has a matching `.sha256` file. Each matrix job also uploads a `release-notes-<out-dir>.md` asset with the resolved Dart commit and `dart --version` output for that sanitizer.
          files: |
            ${{ env.OUTPUT_FILENAME }}
            ${{ env.OUTPUT_FILENAME }}.sha256
            release-notes-${{ matrix.info.out_dir }}.md
          prerelease: true
